<div class="controls">

    <!-- MASSA -->

    <div class="control">

        <label>
            MASSA DEL FORAT NEGRE
        </label>

        <div class="valor-control">
            <strong id="massaValor"></strong>
        </div>

        <input
            type="range"
            id="massaMantissa"
            min="1"
            max="9.9"
            step="0.1"
            value="3.4"
        >

        <input
            type="range"
            id="massaExponent"
            min="30"
            max="100"
            step="1"
            value="38"
        >

        <div class="rang">

            Mantissa:
            <span id="massaMantissaValor">3,4</span>

            × 10^

            <span id="massaExponentValor">38</span>

        </div>

    </div>


    <!-- PERÍODE -->

    <div class="control">

        <label>
            PERÍODE ORBITAL
        </label>

        <div class="valor-control">
            <strong id="periodeValor"></strong>
        </div>

        <input
            type="range"
            id="periodeMantissa"
            min="1"
            max="9.9"
            step="0.1"
            value="1"
        >

        <input
            type="range"
            id="periodeExponent"
            min="0"
            max="100"
            step="1"
            value="6"
        >

        <div class="rang">

            Mantissa:
            <span id="periodeMantissaValor">1,0</span>

            × 10^

            <span id="periodeExponentValor">6</span>

        </div>

    </div>

</div>
